<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de ingressos</title>
<meta name="description" content="Preços ao vivo do monitor de ingressos">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<style>
  :root {
    color-scheme: light;
    --page: #f4f3f0;
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --border: #e2e1dc;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #77766f;
    --series-1: #2a78d6;
    --band: rgba(42, 120, 214, 0.10);
    --grid: #e7e6e1;
    --good: #0ca30c;
    --good-text: #006300;
    --good-bg: #e6f4e6;
    --critical: #d03b3b;
    --critical-bg: #fbeaea;
    --warning: #fab219;
    --warning-bg: #fdf3dc;
    --cta: #0b0b0b;
    --cta-text: #fcfcfb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #111110;
      --surface-1: #1a1a19;
      --surface-2: #232321;
      --border: #2f2f2c;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #949389;
      --series-1: #3987e5;
      --band: rgba(57, 135, 229, 0.16);
      --grid: #2a2a28;
      --good-text: #5fd35f;
      --good-bg: #16301a;
      --critical-bg: #3a1c1c;
      --warning-bg: #3a2f14;
      --cta: #f0efec;
      --cta-text: #111110;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #111110;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --border: #2f2f2c;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #949389;
    --series-1: #3987e5;
    --band: rgba(57, 135, 229, 0.16);
    --grid: #2a2a28;
    --good-text: #5fd35f;
    --good-bg: #16301a;
    --critical-bg: #3a1c1c;
    --warning-bg: #3a2f14;
    --cta: #f0efec;
    --cta-text: #111110;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--surface-2); color: var(--text-primary);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .pill.live { background: var(--good-bg); }
  .pill.live .dot { background: var(--good); animation: pulse 2s infinite; }
  .pill.fail { background: var(--critical-bg); }
  .pill.fail .dot { background: var(--critical); }
  .pill.stale { background: var(--warning-bg); }
  .pill.stale .dot { background: var(--warning); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) { .pill.live .dot { animation: none; } }

  .banner {
    display: none; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px;
    background: var(--critical-bg); color: var(--text-primary); font-size: 14px;
  }
  .banner.show { display: block; }
  .banner.warn { background: var(--warning-bg); }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile .label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .tile .note { font-size: 12px; color: var(--text-muted); margin-top: 2px; min-height: 1em; }
  .tile.hit { border-color: var(--good); }
  .tile.hit .note { color: var(--good-text); font-weight: 600; }
  @media (max-width: 560px) {
    .tiles { grid-template-columns: 1fr 1fr; }
    .tiles .tile:last-child { grid-column: 1 / -1; }
    .tile .value { font-size: 22px; }
  }

  .cta {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 16px; margin-bottom: 12px; border-radius: 12px;
    background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border);
    font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .cta.hot { background: var(--cta); color: var(--cta-text); border-color: var(--cta); }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h2 { font-size: 15px; margin: 0; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--text-secondary); font: inherit; font-size: 13px;
    padding: 5px 10px; border-radius: 6px; cursor: pointer; min-height: 32px;
  }
  .seg button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .chart-wrap { position: relative; }
  #chart { display: block; width: 100%; height: 240px; touch-action: pan-y; }
  #chart text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--text-muted); font-size: 14px; padding: 40px 0; text-align: center; }
  .tip {
    position: absolute; pointer-events: none; display: none; z-index: 2;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap;
  }
  .tip b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .tip .muted { color: var(--text-muted); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--text-secondary); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.price .badge { margin-top: 4px; }
  td.price { width: 1%; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.ctx { color: var(--text-secondary); word-break: break-word; }
  tr.in td.price { color: var(--good-text); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--good-bg); color: var(--good-text); white-space: nowrap; }
  label.toggle { font-size: 13px; color: var(--text-secondary); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

  footer { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 12px; }
  .btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; min-height: 32px; }
  .stack > * + * { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🎫 Monitor de ingressos</h1>
      <div class="sub" id="sub">Carregando…</div>
    </div>
    <span class="pill" id="pill"><span class="dot"></span><span id="pill-text">Conectando…</span></span>
  </header>

  <div class="banner" id="banner" role="status"></div>

  <div class="tiles">
    <div class="card tile" id="tile-min">
      <div class="label">Menor preço agora</div>
      <div class="value" id="v-min">—</div>
      <div class="note" id="n-min"></div>
    </div>
    <div class="card tile" id="tile-hit">
      <div class="label">Na sua faixa</div>
      <div class="value" id="v-hit">—</div>
      <div class="note" id="n-hit"></div>
    </div>
    <div class="card tile">
      <div class="label">Sua faixa</div>
      <div class="value" id="v-range" style="font-size:18px">—</div>
      <div class="note" id="n-range"></div>
    </div>
  </div>

  <a class="cta" id="cta" href="#" target="_blank" rel="noopener noreferrer">Abrir página do evento ↗</a>

  <div class="stack">
    <section class="card">
      <div class="section-head">
        <h2>Menor preço ao longo do tempo</h2>
        <div class="seg" role="group" aria-label="Período">
          <button data-h="6" aria-pressed="false">6h</button>
          <button data-h="24" aria-pressed="true">24h</button>
          <button data-h="168" aria-pressed="false">7 dias</button>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <svg id="chart" role="img" aria-label="Gráfico do menor preço ao longo do tempo"></svg>
        <div class="tip" id="tip"></div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 id="offers-title">Ofertas na página</h2>
        <label class="toggle"><input type="checkbox" id="only-hit"> Só na minha faixa</label>
      </div>
      <table>
        <thead><tr><th>Preço</th><th>Detalhes</th></tr></thead>
        <tbody id="offers"></tbody>
      </table>
    </section>
  </div>

  <footer>
    <span id="foot">Atualiza sozinho a cada ~1 min.</span>
    <button class="btn" id="refresh">Atualizar agora</button>
  </footer>
</main>

<script>
(() => {
  // ---- de onde vêm os dados -------------------------------------------------
  // Hospedado em <usuario>.github.io/<repo>: descobre o repositório pela URL.
  // ?data=<url> força outra fonte (útil para testes).
  const params = new URLSearchParams(location.search);
  let OWNER = "gustavodias-ui", REPO = "Teste";
  if (location.hostname.endsWith(".github.io")) {
    OWNER = location.hostname.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean)[0];
    if (seg) REPO = seg;
  }
  const BRANCH = params.get("branch") || "live-data";
  const DATA_OVERRIDE = params.get("data");
  const REFRESH_MS = 70_000; // a API do GitHub permite 60 consultas/hora sem login

  const $ = (id) => document.getElementById(id);
  const brl = (v) => v == null ? "—" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const brlShort = (v) => "R$ " + Math.round(v).toLocaleString("pt-BR");

  let status = null;
  let rangeHours = 24;
  try { const h = localStorage.getItem("rangeHours"); if (h) rangeHours = +h; } catch (e) {}
  try { $("only-hit").checked = localStorage.getItem("onlyHit") === "1"; } catch (e) {}

  async function fetchStatus() {
    if (DATA_OVERRIDE) {
      const r = await fetch(DATA_OVERRIDE + (DATA_OVERRIDE.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { notFound: r.status === 404 });
      return r.json();
    }
    // 1º: API do GitHub (sempre a versão mais nova; limite de 60 consultas/hora por aparelho)
    try {
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/status.json?ref=${BRANCH}`,
        { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
      if (r.ok) return r.json();
      if (r.status === 404) throw Object.assign(new Error("sem dados"), { notFound: true });
    } catch (e) { if (e.notFound) throw e; }
    // 2º: arquivo bruto (pode vir com alguns minutos de atraso por cache)
    const r = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/status.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { notFound: r.status === 404 });
    return r.json();
  }

  function ago(iso) {
    if (!iso) return "—";
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return `há ${s} s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `há ${m} min`;
    const h = Math.floor(m / 60);
    if (h < 48) return `há ${h} h ${m % 60} min`;
    return `há ${Math.floor(h / 24)} dias`;
  }
  // tira os pedaços do contexto que são só o preço ("R$ 645,50"), que já aparece na coluna Preço
  const cleanContext = (ctx) => ctx.split(" | ").filter((p) => !/^R\$\s*[\d.,]+$/.test(p.trim())).join(" · ");
  const fmtTime = (d) => d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

  // ---- cabeçalho / status ----------------------------------------------------
  function renderHeader() {
    const pill = $("pill"), banner = $("banner");
    pill.className = "pill";
    banner.className = "banner";
    if (!status) return;
    const ageS = (Date.now() - new Date(status.updated_at).getTime()) / 1000;
    const staleAfter = Math.max(360, (status.interval_seconds || 120) * 3);
    $("sub").textContent = `Última verificação ${ago(status.updated_at)} · ${fmtTime(new Date(status.updated_at))}`;
    if (ageS > staleAfter) {
      pill.classList.add("stale");
      $("pill-text").textContent = "Parado";
      banner.classList.add("show", "warn");
      banner.textContent = `O monitor não manda dados ${ago(status.updated_at)}. Confira a aba Actions do GitHub: ele pode ter sido desativado ou estar na fila.`;
    } else if (!status.ok) {
      pill.classList.add("fail");
      $("pill-text").textContent = "Falha ao ler";
      banner.classList.add("show");
      banner.textContent = `Não consegui ler a página do evento (${status.consecutive_failures}× seguidas): ${status.failure || "erro desconhecido"}. Os preços abaixo são da última leitura boa, ${ago(status.offers_at)}.`;
    } else {
      pill.classList.add("live");
      $("pill-text").textContent = "Ao vivo";
    }
  }

  // ---- números + botão -------------------------------------------------------
  function renderTiles() {
    const offers = status.offers || [];
    const hits = offers.filter((o) => o.in_range);
    const min = offers.length ? Math.min(...offers.map((o) => o.price)) : null;
    const minOffer = offers.find((o) => o.price === min);
    $("v-min").textContent = brl(min);
    $("n-min").textContent = minOffer ? cleanContext(minOffer.context) : "";
    $("v-hit").textContent = String(hits.length);
    $("n-hit").textContent = hits.length ? `a partir de ${brl(Math.min(...hits.map((o) => o.price)))}` : "nenhuma ainda";
    $("tile-hit").classList.toggle("hit", hits.length > 0);
    $("v-range").textContent = `${brlShort(status.min_price)} – ${brlShort(status.max_price)}`;
    $("n-range").textContent = status.keyword ? `setor: ${status.keyword}` : "todos os setores";

    const cta = $("cta");
    cta.href = status.url;
    cta.classList.toggle("hot", hits.length > 0);
    cta.textContent = hits.length ? `Comprar agora: ${hits.length} oferta(s) na faixa ↗` : "Abrir página do evento ↗";

    document.title = hits.length ? `(${hits.length}) ${brl(Math.min(...hits.map((o) => o.price)))} · Monitor` : "Monitor de ingressos";
  }

  // ---- tabela ----------------------------------------------------------------
  function renderOffers() {
    const tbody = $("offers");
    tbody.replaceChildren();
    const onlyHit = $("only-hit").checked;
    const all = (status.offers || []).slice().sort((a, b) => a.price - b.price);
    const list = onlyHit ? all.filter((o) => o.in_range) : all;
    $("offers-title").textContent = `Ofertas na página (${all.length})`;
    if (!list.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 2; td.className = "ctx";
      td.textContent = onlyHit ? "Nenhuma oferta na sua faixa no momento." : "Nenhum preço lido ainda.";
      tr.append(td); tbody.append(tr);
      return;
    }
    for (const o of list) {
      const tr = document.createElement("tr");
      if (o.in_range) tr.className = "in";
      const p = document.createElement("td"); p.className = "price"; p.textContent = brl(o.price);
      if (o.in_range) { const s = document.createElement("div"); s.innerHTML = '<span class="badge">✓ Na faixa</span>'; p.append(s); }
      const c = document.createElement("td"); c.className = "ctx"; c.textContent = cleanContext(o.context) || o.context; // texto vem do site: textContent
      tr.append(p, c); tbody.append(tr);
    }
  }

  // ---- gráfico (linha em degraus: o preço vale até a próxima leitura) --------
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.append(n);
    return n;
  };
  let chartGeom = null;

  function renderChart() {
    const svg = $("chart");
    svg.replaceChildren();
    $("tip").style.display = "none";
    const W = svg.clientWidth || 600, H = svg.clientHeight || 240;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const now = Date.now();
    const t0 = now - rangeHours * 3600e3;
    const all = (status.history || []).map(([t, p, n]) => ({ t: new Date(t).getTime(), p, n }));
    // inclui o último ponto anterior à janela, para a linha começar na borda
    const firstIn = all.findIndex((d) => d.t >= t0);
    const pts = firstIn === -1 ? all.slice(-1) : all.slice(Math.max(0, firstIn - 1));
    if (!pts.length) {
      const t = el("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, svg);
      t.textContent = "Ainda sem histórico. Ele aparece depois das primeiras verificações.";
      chartGeom = null;
      return;
    }
    const lastT = new Date(status.offers_at || status.updated_at).getTime();
    const m = { l: 56, r: 12, t: 12, b: 26 };
    const xMin = Math.max(t0, Math.min(pts[0].t, now)), xMax = now;
    const prices = pts.map((d) => d.p);
    let yLo = Math.min(...prices, status.min_price), yHi = Math.max(...prices, status.max_price);
    const pad = (yHi - yLo) * 0.08 || yHi * 0.1 || 10;
    yLo = Math.max(0, yLo - pad); yHi += pad;
    const x = (t) => m.l + ((Math.max(t, xMin) - xMin) / (xMax - xMin || 1)) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - (v - yLo) / (yHi - yLo)) * (H - m.t - m.b);

    // grade e eixo Y (recessivos)
    const ticks = niceTicks(yLo, yHi, 4);
    for (const v of ticks) {
      el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
      const t = el("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, svg);
      t.textContent = brlShort(v);
    }
    // eixo X: marcas em horas "redondas" (no fuso de quem está vendo)
    const maxTicks = W < 420 ? 4 : 7;
    const HOUR = 3600e3;
    const step = [0.25, 0.5, 1, 2, 3, 6, 12, 24, 48].map((h) => h * HOUR).find((st) => (xMax - xMin) / st <= maxTicks) || 48 * HOUR;
    const start = new Date(xMin);
    if (step >= 24 * HOUR) start.setHours(0, 0, 0, 0); else start.setMinutes(0, 0, 0);
    const walk = Math.min(step, HOUR); // anda de hora em hora e só marca as horas múltiplas do passo
    for (let tv = start.getTime(); tv <= xMax; tv += step >= 24 * HOUR ? step : walk) {
      const d = new Date(tv);
      if (step < 24 * HOUR && step >= HOUR && d.getHours() % (step / HOUR)) continue;
      if (tv < xMin) continue;
      const px = x(tv);
      if (px < m.l + 14 || px > W - m.r - 14) continue;
      const t = el("text", { x: px, y: H - 6, "text-anchor": "middle" }, svg);
      t.textContent = step >= 24 * HOUR ? d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })
                    : d.getHours() === 0 && d.getMinutes() === 0 ? d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })
                    : d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    // faixa desejada
    const bandTop = y(Math.min(status.max_price, yHi)), bandBot = y(Math.max(status.min_price, yLo));
    if (bandBot > bandTop) {
      el("rect", { x: m.l, y: bandTop, width: W - m.l - m.r, height: bandBot - bandTop, fill: "var(--band)" }, svg);
      const lbl = el("text", { x: W - m.r - 6, y: bandTop + 14, "text-anchor": "end", style: "fill: var(--text-secondary); font-weight: 600" }, svg);
      lbl.textContent = "Sua faixa";
    }

    // linha em degraus; interrompe quando o monitor ficou mais de 20 min sem dados
    const GAP = 20 * 60e3;
    let d = "";
    for (let i = 0; i < pts.length; i++) {
      const cur = pts[i];
      const next = i + 1 < pts.length ? pts[i + 1].t : lastT;
      const xs = x(cur.t), xe = x(Math.min(next, now));
      d += (i === 0 || cur.t - pts[i - 1].t > GAP ? `M${xs},${y(cur.p)}` : `L${xs},${y(cur.p)}`) + `H${xe}`;
    }
    el("path", { d, fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    const last = pts[pts.length - 1];
    el("circle", { cx: x(Math.min(lastT, now)), cy: y(last.p), r: 4.5, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }, svg);

    const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
    const dot = el("circle", { r: 4.5, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }, svg);
    chartGeom = { pts, x, y, m, W, H, cross, dot, xMin, xMax };
  }

  function niceTicks(lo, hi, n) {
    const span = hi - lo, raw = span / n;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => s >= raw) || raw;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(v);
    return out;
  }

  function onPointer(ev) {
    if (!chartGeom) return;
    const { pts, x, y, m, W, cross, dot, xMin, xMax } = chartGeom;
    const svg = $("chart"), rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    if (px < m.l || px > W - m.r) return hideTip();
    const t = xMin + ((px - m.l) / (W - m.l - m.r)) * (xMax - xMin);
    let cur = null;
    for (const p of pts) { if (p.t <= t) cur = p; else break; }
    if (!cur) return hideTip();
    const cx = px;
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", y(cur.p)); dot.setAttribute("visibility", "visible");
    const tip = $("tip");
    tip.replaceChildren();
    const t1 = document.createElement("div"); t1.className = "muted"; t1.textContent = fmtTime(new Date(t));
    const t2 = document.createElement("div"); const b = document.createElement("b"); b.textContent = brl(cur.p); t2.append("Menor preço: ", b);
    const t3 = document.createElement("div"); t3.textContent = `${cur.n} oferta(s) na faixa`;
    tip.append(t1, t2, t3);
    tip.style.display = "block";
    const wrap = $("chart-wrap").getBoundingClientRect();
    const left = ev.clientX - wrap.left;
    const tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, left + 12 + tw > wrap.width ? left - tw - 12 : left + 12), wrap.width - tw) + "px";
    tip.style.top = Math.max(0, y(cur.p) * (rect.height / chartGeom.H) - 60) + "px";
  }
  function hideTip() {
    $("tip").style.display = "none";
    if (chartGeom) { chartGeom.cross.setAttribute("visibility", "hidden"); chartGeom.dot.setAttribute("visibility", "hidden"); }
  }
  $("chart").addEventListener("pointermove", onPointer);
  $("chart").addEventListener("pointerdown", onPointer);
  $("chart").addEventListener("pointerleave", hideTip);

  // ---- controles -------------------------------------------------------------
  document.querySelectorAll(".seg button").forEach((btn) => {
    btn.setAttribute("aria-pressed", String(+btn.dataset.h === rangeHours));
    btn.addEventListener("click", () => {
      rangeHours = +btn.dataset.h;
      try { localStorage.setItem("rangeHours", String(rangeHours)); } catch (e) {}
      document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      if (status) renderChart();
    });
  });
  $("only-hit").addEventListener("change", () => {
    try { localStorage.setItem("onlyHit", $("only-hit").checked ? "1" : "0"); } catch (e) {}
    if (status) renderOffers();
  });
  $("refresh").addEventListener("click", load);
  addEventListener("resize", () => { if (status) renderChart(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

  let loading = false;
  async function load() {
    if (loading) return;
    loading = true;
    $("refresh").disabled = true;
    try {
      status = await fetchStatus();
      renderHeader(); renderTiles(); renderOffers(); renderChart();
      $("foot").textContent = "Atualiza sozinho a cada ~1 min.";
    } catch (e) {
      if (e.notFound) {
        $("sub").textContent = "Ainda não há dados.";
        $("pill").className = "pill stale";
        $("pill-text").textContent = "Aguardando";
        const banner = $("banner");
        banner.className = "banner show warn";
        banner.textContent = "O monitor ainda não publicou nenhuma leitura. Confira se o workflow está rodando na aba Actions do GitHub (e se os Secrets/Variables foram configurados).";
      } else {
        $("foot").textContent = `Sem conexão agora (${e.message}). Tento de novo em 1 min.`;
      }
    } finally {
      loading = false;
      $("refresh").disabled = false;
    }
  }

  load();
  setInterval(load, REFRESH_MS);
  setInterval(() => { if (status) renderHeader(); }, 1000); // "há X s" andando
})();
</script>
</body>
</html>
